
name: Verificar Backend e Frontend

on:
  push:
    branches:
      - auditoria-seguranca
      - desenvolvimento

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Compilar Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Compilar backend
        run: npm run build

  frontend:
    name: Compilar Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar frontend
        run: npm run build
        env:
          CI: "false"
